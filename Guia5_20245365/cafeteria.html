<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <script src="./js/pedidos.js" defer></script>   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/styles.css" rel="stylesheet" />
</head>
<body>
   <header class="coffee-header py-4 mb-4 shadow-sm">
        <div class="container">
            <h1 class="h3 mb-0 fw-bold text-white">☕ Sistema de Pedidos - Cafetería</h1>
            <p class="mb-0 text-white-50 small">Registro y administración de órdenes en tiempo real</p>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row g-4">
            
            <div class="col-lg-4">
                <div class="card custom-card shadow-sm border-0">
                    <div class="card-header custom-card-header py-3">
                        <h2 class="h5 mb-0 fw-semibold">Nuevo Pedido</h2>
                    </div>
                    <div class="card-body p-4">
                        <div id="alerta-validacion" class="alert alert-danger d-none" role="alert">
                        </div>

                        <form id="form-pedido" novalidate>
                            <div class="mb-3">
                                <label for="input-producto" class="form-label fw-medium">Nombre del producto <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="input-producto" placeholder="Ej. Café americano" required>
                            </div>

                            <div class="mb-3">
                                <label for="input-precio" class="form-label fw-medium">Precio unitario ($) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="input-precio" placeholder="Ej. 2.50" step="0.01" min="0.01" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="input-cantidad" class="form-label fw-medium">Cantidad solicitada <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="input-cantidad" placeholder="Ej. 3" step="1" min="1" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" id="btn-agregar" class="btn btn-coffee btn-lg">
                                    Agregar pedido
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                
                <div class="card custom-card shadow-sm border-0 mb-4">
                    <div class="card-body p-3">
                        <div class="row g-2 align-items-end">
                            <div class="col-sm-5">
                                <label for="input-precio-max" class="form-label small fw-semibold text-muted mb-1">
                                    Filtrar por precio unitario máximo ($)
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="input-precio-max" placeholder="Ej. 3.00" step="0.01" min="0">
                                </div>
                            </div>
                            <div class="col-sm-7 d-flex gap-2">
                                <button type="button" id="btn-filtrar" class="btn btn-outline-coffee btn-sm flex-grow-1">
                                    Filtrar productos
                                </button>
                                <button type="button" id="btn-mostrar-todos" class="btn btn-secondary btn-sm flex-grow-1">
                                    Mostrar todos
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card custom-card shadow-sm border-0">
                    <div class="card-header custom-card-header py-3 d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0 fw-semibold">Listado de Pedidos</h2>
                        <button type="button" id="btn-limpiar" class="btn btn-outline-danger btn-sm">
                            Limpiar pedidos
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-coffee">
                                    <tr>
                                        <th scope="col" class="ps-4">Producto</th>
                                        <th scope="col" class="text-end">Precio unitario</th>
                                        <th scope="col" class="text-center">Cantidad</th>
                                        <th scope="col" class="text-end pe-4">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-pedidos">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-4">
                                            No hay pedidos registrados.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card-footer bg-light p-3 border-top">
                        <div class="row text-center text-sm-end align-items-center">
                            <div class="col-sm-6 mb-2 mb-sm-0 text-sm-start ps-sm-4">
                                <span class="text-muted fw-medium">Total de unidades solicitadas:</span>
                                <span id="total-unidades" class="badge bg-secondary fs-6 ms-2">0</span>
                            </div>
                            <div class="col-sm-6 pe-sm-4">
                                <span class="text-muted fw-medium">Monto total de pedidos:</span>
                                <span id="monto-total" class="fs-5 fw-bold text-coffee ms-2">$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
